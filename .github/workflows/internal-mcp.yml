name: Internal MCP
on:
  pull_request:
    paths: ["internal-mcp/**", ".github/workflows/internal-mcp.yml"]
  push:
    branches: [main]
    paths: ["internal-mcp/**", ".github/workflows/internal-mcp.yml"]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: internal-mcp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: internal-mcp/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm run format:check
      - run: npm test
      - run: npm run test:postgres
      - run: npm run test:container
