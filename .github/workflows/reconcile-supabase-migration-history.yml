name: Reconcile Supabase migration history

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type REPAIR-LABAPP-HISTORY to continue
        required: true
        type: string

permissions:
  contents: read

defaults:
  run:
    shell: bash
    working-directory: laboratorio-app

jobs:
  reconcile:
    name: Replace legacy migration versions
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: production-database-migrations
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: supabase/setup-cli@1dedf2c611547ede7232d26866dd3c56ab903bbb # v1
        with:
          version: 2.117.0
      - name: Reconcile reviewed production history
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          if [[ "$CONFIRMATION" != "REPAIR-LABAPP-HISTORY" ]]; then
            echo "::error::Confirmation text does not match."
            exit 1
          fi
          for variable in SUPABASE_ACCESS_TOKEN SUPABASE_DB_PASSWORD SUPABASE_PROJECT_ID; do
            if [[ -z "${!variable}" ]]; then
              echo "::error::Missing repository secret: ${variable}."
              exit 1
            fi
          done

          supabase link --project-ref "$SUPABASE_PROJECT_ID"
          supabase migration repair --help >/dev/null
          echo "Migration history before reconciliation:"
          supabase migration list --linked

          legacy_versions=(
            20260731022713 20260731023007 20260731025443 20260731025600
            20260731030515 20260731033205 20260731033323 20260801042039
            20260801053646 20260801054636 20260801055951 20260808031634
            20260808032806 20260808032923 20260808040247 20260808042211
            20260813004550 20260818015608 20260818020727 20260818021703
            20260818022151 20260818022529 20260824010340 20260824013432
            20260903004800 20260922040409
          )
          for version in "${legacy_versions[@]}"; do
            supabase migration repair --linked --status reverted "$version"
          done

          for sequence in $(seq -w 1 42); do
            supabase migration repair --linked --status applied "202607220000${sequence}"
          done

          echo "Migration history after reconciliation:"
          supabase migration list --linked
