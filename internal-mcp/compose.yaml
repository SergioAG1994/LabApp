name: labapp-internal-mcp
services:
  mcp:
    build: .
    init: true
    restart: unless-stopped
    ports:
      - "127.0.0.1:3100:3100"
    environment:
      MCP_TOKEN_FILE: /run/secrets/mcp_token
      DATABASE_URL_FILE: /run/secrets/database_url
      LINEAR_API_KEY_FILE: /run/secrets/linear_api_key
    secrets:
      - mcp_token
      - database_url
      - linear_api_key
    volumes:
      - type: bind
        source: ${LABAPP_MCP_UPLOADS:?Set an absolute dedicated uploads directory}
        target: /uploads
        read_only: true
    read_only: true
    tmpfs:
      - /tmp:size=16m,noexec,nosuid
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 512m
    cpus: 1.0
    pids_limit: 128
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:3100/mcp',{method:'POST',headers:{Authorization:'Bearer '+require('fs').readFileSync('/run/secrets/mcp_token','utf8').trim(),'Content-Type':'application/json',Accept:'application/json, text/event-stream'},body:JSON.stringify({jsonrpc:'2.0',id:1,method:'initialize',params:{protocolVersion:'2025-11-25',capabilities:{},clientInfo:{name:'healthcheck',version:'1'}}})}).then(async r=>{if(!r.ok)process.exit(1);const id=r.headers.get('mcp-session-id');if(id)await fetch('http://127.0.0.1:3100/mcp',{method:'DELETE',headers:{Authorization:'Bearer '+require('fs').readFileSync('/run/secrets/mcp_token','utf8').trim(),'mcp-session-id':id}})}).catch(()=>process.exit(1))"]
      interval: 60s
      timeout: 10s
      retries: 3
secrets:
  mcp_token:
    file: ${LABAPP_MCP_SECRETS:?Set an absolute secrets directory outside the checkout}/mcp_token
  database_url:
    file: ${LABAPP_MCP_SECRETS}/database_url
  linear_api_key:
    file: ${LABAPP_MCP_SECRETS}/linear_api_key
